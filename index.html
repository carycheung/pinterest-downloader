<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinterest 批量下载器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #fef3f3 0%, #fff 50%, #f3f8ff 100%);
    min-height: 100vh;
    padding: 32px 20px 120px;
    color: #222;
  }
  .container { max-width: 980px; margin: 0 auto; }
  h1 {
    font-size: 26px;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #e60023, #bd081c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 24px; }

  .panel {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .panel-title {
    font-size: 13px;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  textarea {
    width: 100%;
    min-height: 140px;
    padding: 12px 14px;
    border: 2px solid #eee;
    border-radius: 10px;
    font-size: 13px;
    font-family: ui-monospace, SF Mono, Menlo, monospace;
    outline: none;
    resize: vertical;
    line-height: 1.6;
    transition: border 0.2s;
  }
  textarea:focus { border-color: #e60023; }

  .control-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-top: 12px;
  }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    background: #f0f0f0;
    color: #333;
  }
  button:hover:not(:disabled) { background: #e0e0e0; }
  button.primary { background: #e60023; color: white; }
  button.primary:hover:not(:disabled) { background: #bd081c; }
  button.ghost { background: transparent; color: #666; padding: 10px 12px; }
  button.ghost:hover:not(:disabled) { background: #f5f5f5; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .folder-info {
    font-size: 12px;
    color: #666;
    font-family: ui-monospace, SF Mono, Menlo, monospace;
    padding: 6px 10px;
    background: #f7f7f7;
    border-radius: 6px;
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .folder-info.unsupported { color: #c00; background: #ffeaea; }

  .progress-bar {
    height: 6px;
    background: #eee;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 14px;
    display: none;
  }
  .progress-bar.show { display: block; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #e60023, #ff5577);
    transition: width 0.3s;
    width: 0;
  }
  .progress-label {
    font-size: 12px;
    color: #666;
    margin-top: 6px;
    display: none;
  }
  .progress-label.show { display: block; }

  .summary-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: #fff8e6;
    border-radius: 10px;
    font-size: 13px;
    color: #8a6d00;
    margin-bottom: 16px;
    display: none;
  }
  .summary-bar.show { display: flex; }
  .summary-bar .count { font-weight: 700; }

  .results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .result-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    position: relative;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .result-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
  .result-card.selected { outline: 3px solid #e60023; }
  .result-card.downloaded { opacity: 0.6; }

  .card-checkbox {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 24px;
    height: 24px;
    background: rgba(255,255,255,0.95);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .card-checkbox input { cursor: pointer; width: 16px; height: 16px; accent-color: #e60023; }

  .card-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    z-index: 2;
  }
  .card-badge.video { background: rgba(230,0,35,0.9); }

  .card-media {
    width: 100%;
    height: 200px;
    object-fit: cover;
    background: #f0f0f0;
    display: block;
  }
  .card-media.video { background: #000; object-fit: contain; }

  .card-meta-row {
    position: absolute;
    bottom: 44px;
    left: 8px;
    right: 8px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    pointer-events: none;
    z-index: 2;
  }
  .meta-chip {
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 600;
    backdrop-filter: blur(4px);
  }
  .meta-chip.size { background: rgba(230,0,35,0.85); }

  .card-footer {
    padding: 10px 12px;
    font-size: 11px;
    color: #888;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .card-source {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .card-source a { color: #888; text-decoration: none; }
  .card-source a:hover { color: #e60023; }
  .card-status { font-size: 11px; }
  .card-status.downloaded { color: #0a7a3a; font-weight: 600; }
  .card-status.error { color: #c00; }

  .url-list {
    margin-top: 12px;
    max-height: 200px;
    overflow-y: auto;
    border: 1px solid #eee;
    border-radius: 8px;
  }
  .url-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    font-size: 12px;
    border-bottom: 1px solid #f5f5f5;
    font-family: ui-monospace, SF Mono, Menlo, monospace;
  }
  .url-item:last-child { border-bottom: none; }
  .url-item .url-status {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }
  .url-status.pending { background: #eee; }
  .url-status.loading { background: #fff8e6; animation: pulse 1.2s infinite; }
  .url-status.success { background: #d4f4dd; color: #0a7a3a; }
  .url-status.error { background: #ffeaea; color: #c00; }
  @keyframes pulse { 50% { opacity: 0.5; } }
  .url-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    color: #555;
  }
  .url-result { color: #888; font-size: 11px; }

  .floating-bar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    display: none;
    gap: 10px;
    align-items: center;
    z-index: 10;
    max-width: 90vw;
  }
  .floating-bar.show { display: flex; }
  .floating-bar .selected-count {
    font-size: 13px;
    color: #666;
    padding: 0 8px;
  }
  .floating-bar .selected-count b { color: #e60023; }

  .tip {
    font-size: 12px;
    color: #888;
    margin-top: 8px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Pinterest 批量下载器</h1>
  <p class="subtitle">粘贴多个链接,批量解析和下载视频/图片</p>

  <div class="panel">
    <div class="panel-title">1. 粘贴 Pinterest 链接</div>
    <textarea id="urlInput" placeholder="https://www.pinterest.com/pin/123456789/
https://pin.it/abc123
https://www.pinterest.com/pin/987654321/

每行一个 URL,空行会被忽略。Cmd/Ctrl+Enter 直接解析。"></textarea>
    <div class="control-row">
      <button class="primary" id="parseBtn">解析全部</button>
      <button id="clearBtn">清空</button>
      <span class="tip" id="urlCountTip"></span>
    </div>
    <div class="progress-bar" id="parseProgress"><div class="progress-fill" id="parseProgressFill"></div></div>
    <div class="progress-label" id="parseProgressLabel"></div>
    <div class="url-list" id="urlList" style="display:none"></div>
  </div>

  <div class="panel">
    <div class="panel-title">2. 选择保存位置(可选)</div>
    <div class="control-row">
      <button id="folderBtn">选择文件夹</button>
      <span class="folder-info" id="folderInfo">未选择,将使用浏览器默认下载文件夹</span>
    </div>
    <p class="tip" id="folderTip"></p>
  </div>

  <div class="summary-bar" id="summary"></div>
  <div class="results" id="results"></div>
</div>

<div class="floating-bar" id="floatingBar">
  <span class="selected-count">已选 <b id="selectedCount">0</b> / <span id="totalCount">0</span></span>
  <button id="selectAllBtn">全选</button>
  <button id="selectNoneBtn">取消</button>
  <button id="selectVideosBtn">仅视频</button>
  <button id="selectImagesBtn">仅图片</button>
  <button class="primary" id="downloadSelectedBtn">下载选中</button>
  <button id="downloadZipBtn">打包 ZIP</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const CORS_PROXIES = [
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
];
const BINARY_PROXY = url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`;
const SIZE_RANK = { originals: 9999, '1200x': 1200, '736x': 736, '600x315': 600, '564x': 564, '474x': 474, '236x': 236, '136x136': 136, '60x60': 60 };
const PARSE_CONCURRENCY = 3;
const DOWNLOAD_CONCURRENCY = 3;

const $ = id => document.getElementById(id);
const state = {
  items: [],
  dirHandle: null,
};

const els = {
  urlInput: $('urlInput'),
  parseBtn: $('parseBtn'),
  clearBtn: $('clearBtn'),
  urlCountTip: $('urlCountTip'),
  parseProgress: $('parseProgress'),
  parseProgressFill: $('parseProgressFill'),
  parseProgressLabel: $('parseProgressLabel'),
  urlList: $('urlList'),
  folderBtn: $('folderBtn'),
  folderInfo: $('folderInfo'),
  folderTip: $('folderTip'),
  summary: $('summary'),
  results: $('results'),
  floatingBar: $('floatingBar'),
  selectedCount: $('selectedCount'),
  totalCount: $('totalCount'),
  selectAllBtn: $('selectAllBtn'),
  selectNoneBtn: $('selectNoneBtn'),
  selectVideosBtn: $('selectVideosBtn'),
  selectImagesBtn: $('selectImagesBtn'),
  downloadSelectedBtn: $('downloadSelectedBtn'),
  downloadZipBtn: $('downloadZipBtn'),
};

const supportsFS = 'showDirectoryPicker' in window;
if (!supportsFS) {
  els.folderInfo.textContent = '当前浏览器不支持,文件将走默认下载';
  els.folderInfo.classList.add('unsupported');
  els.folderBtn.disabled = true;
  els.folderTip.textContent = '提示:Chrome / Edge / Arc 支持直接写入指定文件夹,Safari/Firefox 用默认下载文件夹。';
}

function parseUrls(text) {
  return text.split('\n')
    .map(s => s.trim())
    .filter(s => s && /pinterest\.|pin\.it/i.test(s));
}

function updateUrlCount() {
  const urls = parseUrls(els.urlInput.value);
  els.urlCountTip.textContent = urls.length ? `已识别 ${urls.length} 个有效链接` : '';
}
els.urlInput.addEventListener('input', updateUrlCount);

async function pool(items, concurrency, worker) {
  let i = 0;
  const results = new Array(items.length);
  async function run() {
    while (i < items.length) {
      const idx = i++;
      try { results[idx] = await worker(items[idx], idx); }
      catch (e) { results[idx] = { error: e }; }
    }
  }
  await Promise.all(Array(Math.min(concurrency, items.length)).fill(0).map(run));
  return results;
}

async function fetchWithProxy(targetUrl) {
  let lastErr;
  for (let i = 0; i < CORS_PROXIES.length; i++) {
    try {
      const res = await fetch(CORS_PROXIES[i](targetUrl), { redirect: 'follow' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      if (text && text.length > 500) return { text, finalUrl: res.url };
      throw new Error('响应过短');
    } catch (e) { lastErr = e; }
  }
  throw new Error(`代理全失败: ${lastErr?.message || ''}`);
}

async function resolveShortUrl(shortUrl) {
  const { finalUrl, text } = await fetchWithProxy(shortUrl);
  if (finalUrl && finalUrl.includes('/pin/')) return finalUrl;
  const m = text.match(/https?:\/\/(?:www\.)?pinterest\.[^"'\s]+\/pin\/\d+/);
  if (m) return m[0];
  const canonical = text.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']/i);
  if (canonical && canonical[1].includes('/pin/')) return canonical[1];
  throw new Error('短链解析失败');
}

function extractImages(html) {
  const byHash = {};
  const re = /["']https:\/\/i\.pinimg\.com\/(originals|\d+x\d*|\d+x)\/([a-f0-9]{2}\/[a-f0-9]{2}\/[a-f0-9]{2}\/[a-f0-9]+\.(?:jpg|jpeg|png|gif|webp))["']/gi;
  let m;
  while ((m = re.exec(html)) !== null) {
    if (!byHash[m[2]]) byHash[m[2]] = true;
  }
  return Object.keys(byHash).map(hash => ({
    type: 'image',
    url: `https://i.pinimg.com/originals/${hash}`,
    hash: hash.split('/').pop().split('.')[0],
    ext: hash.split('.').pop().toLowerCase(),
  }));
}

function videoQualityScore(url) {
  const m = url.match(/_(\d{3,4})[wp]\.mp4/i);
  if (m) return parseInt(m[1], 10);
  if (/1080/.test(url)) return 1080;
  if (/720/.test(url)) return 720;
  if (/540/.test(url)) return 540;
  if (/480/.test(url)) return 480;
  if (/360/.test(url)) return 360;
  return 0;
}

function videoCodecPreference(url) {
  if (/expMp4|h264/i.test(url)) return 2;
  if (/hevcMp4|h265/i.test(url)) return 1;
  return 0;
}

function extractVideos(html) {
  const urls = new Set();
  const re = /https:\/\/v[0-9]?\.pinimg\.com\/videos\/[^"'\s<>)]+\.mp4/gi;
  let m;
  while ((m = re.exec(html)) !== null) urls.add(m[0]);

  const groups = {};
  for (const url of urls) {
    const hashMatch = url.match(/([a-f0-9]{2}\/[a-f0-9]{2}\/[a-f0-9]{2}\/[a-f0-9]{32})/i);
    const key = hashMatch ? hashMatch[1] : url;
    if (!groups[key]) groups[key] = [];
    groups[key].push(url);
  }

  return Object.keys(groups).map(key => {
    const sorted = groups[key].sort((a, b) => {
      const codecDiff = videoCodecPreference(b) - videoCodecPreference(a);
      if (codecDiff !== 0) return codecDiff;
      return videoQualityScore(b) - videoQualityScore(a);
    });
    const best = sorted[0];
    const quality = videoQualityScore(best);
    return {
      type: 'video',
      url: best,
      hash: key.split('/').pop(),
      ext: 'mp4',
      quality,
      variantCount: groups[key].length,
    };
  });
}

async function parseOnePin(sourceUrl) {
  let pinUrl = sourceUrl;
  if (/pin\.it/i.test(sourceUrl)) {
    pinUrl = await resolveShortUrl(sourceUrl);
  }
  const { text: html } = await fetchWithProxy(pinUrl);
  const videos = extractVideos(html);
  const images = extractImages(html);
  const pinId = pinUrl.match(/\/pin\/(\d+)/)?.[1] || '';
  const poster = images[0]?.url;

  const items = videos.length > 0
    ? videos.map(v => ({ ...v, poster }))
    : images;

  return items.map(it => ({
    ...it,
    sourceUrl,
    pinId,
    filename: `${pinId || 'pin'}_${it.hash}.${it.ext}`,
  }));
}

function renderUrlList(urlStates) {
  els.urlList.style.display = 'block';
  els.urlList.innerHTML = urlStates.map((s, i) => `
    <div class="url-item">
      <span class="url-status ${s.status}">${statusIcon(s.status)}</span>
      <span class="url-text" title="${s.url}">${s.url}</span>
      <span class="url-result">${s.result || ''}</span>
    </div>
  `).join('');
}
function statusIcon(s) {
  return { pending: '·', loading: '·', success: '✓', error: '✗' }[s] || '·';
}

async function handleBatchParse() {
  const urls = parseUrls(els.urlInput.value);
  if (urls.length === 0) {
    alert('请粘贴至少一个有效的 Pinterest 链接');
    return;
  }

  state.items = [];
  els.results.innerHTML = '';
  els.summary.classList.remove('show');
  els.floatingBar.classList.remove('show');

  const urlStates = urls.map(url => ({ url, status: 'pending', result: '' }));
  renderUrlList(urlStates);
  els.parseProgress.classList.add('show');
  els.parseProgressLabel.classList.add('show');
  els.parseBtn.disabled = true;

  let done = 0;
  await pool(urls, PARSE_CONCURRENCY, async (url, idx) => {
    urlStates[idx].status = 'loading';
    renderUrlList(urlStates);
    try {
      const items = await parseOnePin(url);
      if (items.length === 0) {
        urlStates[idx].status = 'error';
        urlStates[idx].result = '未提取到媒体';
      } else {
        urlStates[idx].status = 'success';
        urlStates[idx].result = `${items.length} 个`;
        items.forEach(it => state.items.push({
          ...it,
          id: `${idx}_${state.items.length}`,
          selected: true,
          downloadStatus: 'pending',
        }));
      }
    } catch (e) {
      urlStates[idx].status = 'error';
      urlStates[idx].result = e.message;
    }
    done++;
    const pct = (done / urls.length) * 100;
    els.parseProgressFill.style.width = pct + '%';
    els.parseProgressLabel.textContent = `解析进度 ${done}/${urls.length}`;
    renderUrlList(urlStates);
    renderResults();
  });

  els.parseBtn.disabled = false;
  els.parseProgressLabel.textContent = `完成 · 共 ${state.items.length} 个媒体文件`;
  showSummary();
}

function renderResults() {
  els.results.innerHTML = '';
  state.items.forEach(item => {
    const card = document.createElement('div');
    card.className = `result-card ${item.selected ? 'selected' : ''} ${item.downloadStatus === 'done' ? 'downloaded' : ''}`;
    card.dataset.id = item.id;

    const isVideo = item.type === 'video';
    const mediaTag = isVideo
      ? `<video class="card-media video" src="${item.url}" ${item.poster ? `poster="${item.poster}"` : ''} preload="metadata" controls playsinline></video>`
      : `<img class="card-media" src="${item.url}" loading="lazy" alt="" />`;

    const chips = [];
    if (item.duration != null) chips.push(`<span class="meta-chip">${formatDuration(item.duration)}</span>`);
    if (item.width && item.height) chips.push(`<span class="meta-chip">${item.width}×${item.height}</span>`);
    if (item.fileSize != null) chips.push(`<span class="meta-chip size">${formatSize(item.fileSize)}</span>`);

    const statusText = {
      pending: '',
      downloading: '下载中…',
      done: '已下载',
      error: `失败: ${item.errorMsg || ''}`,
    }[item.downloadStatus] || '';
    const statusClass = item.downloadStatus === 'done' ? 'downloaded' : item.downloadStatus === 'error' ? 'error' : '';

    card.innerHTML = `
      <div class="card-checkbox"><input type="checkbox" ${item.selected ? 'checked' : ''} data-id="${item.id}" /></div>
      <div class="card-badge ${isVideo ? 'video' : ''}">${isVideo ? 'VIDEO' : 'IMG'}</div>
      ${mediaTag}
      <div class="card-meta-row">${chips.join('')}</div>
      <div class="card-footer">
        <span class="card-source"><a href="${item.sourceUrl}" target="_blank" title="${item.sourceUrl}">${item.pinId || '链接'}</a></span>
        <span class="card-status ${statusClass}">${statusText}</span>
      </div>
    `;
    els.results.appendChild(card);

    const mediaEl = card.querySelector('.card-media');
    if (isVideo) {
      mediaEl.addEventListener('loadedmetadata', () => {
        if (item.duration == null && isFinite(mediaEl.duration)) {
          item.duration = mediaEl.duration;
          item.width = mediaEl.videoWidth;
          item.height = mediaEl.videoHeight;
          updateChips(card, item);
        }
      });
    } else {
      mediaEl.addEventListener('load', () => {
        if (!item.width) {
          item.width = mediaEl.naturalWidth;
          item.height = mediaEl.naturalHeight;
          updateChips(card, item);
        }
      });
    }
  });

  els.results.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const item = state.items.find(x => x.id === cb.dataset.id);
      if (item) item.selected = cb.checked;
      cb.closest('.result-card').classList.toggle('selected', cb.checked);
      updateSelectionUI();
    });
  });

  updateSelectionUI();
}

function updateChips(card, item) {
  const row = card.querySelector('.card-meta-row');
  if (!row) return;
  const chips = [];
  if (item.duration != null) chips.push(`<span class="meta-chip">${formatDuration(item.duration)}</span>`);
  if (item.width && item.height) chips.push(`<span class="meta-chip">${item.width}×${item.height}</span>`);
  if (item.fileSize != null) chips.push(`<span class="meta-chip size">${formatSize(item.fileSize)}</span>`);
  row.innerHTML = chips.join('');
}

function formatDuration(s) {
  if (!isFinite(s) || s < 0) return '';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

function showSummary() {
  const v = state.items.filter(x => x.type === 'video').length;
  const i = state.items.filter(x => x.type === 'image').length;
  if (state.items.length === 0) { els.summary.classList.remove('show'); return; }
  els.summary.classList.add('show');
  els.summary.innerHTML = `<span>共找到 <span class="count">${state.items.length}</span> 个媒体文件 · 视频 ${v} · 图片 ${i}</span>`;
}

function updateSelectionUI() {
  const total = state.items.length;
  const selected = state.items.filter(x => x.selected).length;
  els.totalCount.textContent = total;
  els.selectedCount.textContent = selected;
  if (total > 0) els.floatingBar.classList.add('show');
  else els.floatingBar.classList.remove('show');
  els.downloadSelectedBtn.disabled = selected === 0;
  els.downloadZipBtn.disabled = selected === 0;
}

async function fetchAsBlob(url) {
  try {
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.blob();
  } catch {
    const res = await fetch(BINARY_PROXY(url));
    if (!res.ok) throw new Error(`代理 ${res.status}`);
    const ct = res.headers.get('content-type') || '';
    if (ct.startsWith('text/html')) throw new Error('代理返回 HTML');
    const blob = await res.blob();
    if (blob.size < 1024) throw new Error(`仅 ${blob.size}B`);
    return blob;
  }
}

function triggerBrowserDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function saveBlob(blob, filename) {
  if (state.dirHandle) {
    const fh = await state.dirHandle.getFileHandle(filename, { create: true });
    const w = await fh.createWritable();
    await w.write(blob);
    await w.close();
  } else {
    triggerBrowserDownload(blob, filename);
  }
}

async function downloadSelected() {
  const targets = state.items.filter(x => x.selected && x.downloadStatus !== 'done');
  if (targets.length === 0) return;

  els.downloadSelectedBtn.disabled = true;
  els.downloadZipBtn.disabled = true;

  let done = 0;
  await pool(targets, DOWNLOAD_CONCURRENCY, async (item) => {
    item.downloadStatus = 'downloading';
    renderResults();
    try {
      const blob = await fetchAsBlob(item.url);
      await saveBlob(blob, item.filename);
      item.fileSize = blob.size;
      item.downloadStatus = 'done';
    } catch (e) {
      item.downloadStatus = 'error';
      item.errorMsg = e.message;
    }
    done++;
    renderResults();
  });

  updateSelectionUI();
  const okCount = targets.filter(x => x.downloadStatus === 'done').length;
  const failCount = targets.length - okCount;
  alert(`下载完成 · 成功 ${okCount}${failCount ? ` · 失败 ${failCount}` : ''}`);
}

async function downloadAsZip() {
  const targets = state.items.filter(x => x.selected);
  if (targets.length === 0) return;
  if (typeof JSZip === 'undefined') { alert('ZIP 库加载失败,请检查网络'); return; }

  els.downloadSelectedBtn.disabled = true;
  els.downloadZipBtn.disabled = true;
  els.downloadZipBtn.textContent = '打包中…';

  const zip = new JSZip();
  let done = 0;
  await pool(targets, DOWNLOAD_CONCURRENCY, async (item) => {
    try {
      const blob = await fetchAsBlob(item.url);
      zip.file(item.filename, blob);
      item.fileSize = blob.size;
      item.downloadStatus = 'done';
    } catch (e) {
      item.downloadStatus = 'error';
      item.errorMsg = e.message;
    }
    done++;
    els.downloadZipBtn.textContent = `打包中 ${done}/${targets.length}`;
    renderResults();
  });

  els.downloadZipBtn.textContent = '生成 ZIP…';
  const zipBlob = await zip.generateAsync({ type: 'blob' });
  const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  await saveBlob(zipBlob, `pinterest_${ts}.zip`);

  els.downloadZipBtn.textContent = '打包 ZIP';
  updateSelectionUI();
}

els.parseBtn.addEventListener('click', handleBatchParse);
els.clearBtn.addEventListener('click', () => {
  els.urlInput.value = '';
  updateUrlCount();
  els.urlList.style.display = 'none';
  els.parseProgress.classList.remove('show');
  els.parseProgressLabel.classList.remove('show');
  state.items = [];
  renderResults();
  els.summary.classList.remove('show');
  els.floatingBar.classList.remove('show');
});
els.urlInput.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') handleBatchParse();
});

els.folderBtn.addEventListener('click', async () => {
  if (!supportsFS) return;
  try {
    state.dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    els.folderInfo.textContent = `已选: ${state.dirHandle.name}/`;
    els.folderInfo.classList.remove('unsupported');
  } catch (e) {
    if (e.name !== 'AbortError') alert('选择失败: ' + e.message);
  }
});

els.selectAllBtn.addEventListener('click', () => {
  state.items.forEach(x => x.selected = true);
  renderResults();
});
els.selectNoneBtn.addEventListener('click', () => {
  state.items.forEach(x => x.selected = false);
  renderResults();
});
els.selectVideosBtn.addEventListener('click', () => {
  state.items.forEach(x => x.selected = x.type === 'video');
  renderResults();
});
els.selectImagesBtn.addEventListener('click', () => {
  state.items.forEach(x => x.selected = x.type === 'image');
  renderResults();
});
els.downloadSelectedBtn.addEventListener('click', downloadSelected);
els.downloadZipBtn.addEventListener('click', downloadAsZip);
</script>
</body>
</html>
